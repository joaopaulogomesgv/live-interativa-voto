<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd2ba" />
      <stop offset="50%" stop-color="#f8b693" />
      <stop offset="100%" stop-color="#e28c68" />
    </linearGradient>
    <filter id="handShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#handShadow)">
    <!-- Braço vindo do canto inferior direito -->
    <path d="M 230 320 L 140 180 C 130 160, 110 130, 95 90 C 88 72, 80 50, 75 35 C 72 25, 60 22, 53 32 C 45 42, 50 60, 58 85 L 75 140 C 65 135, 45 135, 42 150 C 40 160, 50 170, 68 175 C 55 178, 48 188, 50 198 C 53 208, 65 212, 80 212 C 72 216, 68 226, 72 235 C 76 244, 90 248, 110 245 L 180 320 Z" fill="url(#skin)"/>
